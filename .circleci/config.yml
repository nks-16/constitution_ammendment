# Use the latest 2.1 version of CircleCI pipeline process engine.
version: 2.1

# Define jobs
jobs:
  say-hello:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: "Say Hello"
          command: echo "Hello, World!"

  say-bye:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: "Say Bye"
          command: echo "Goodbye, World!"

# Define workflow to orchestrate job execution
workflows:
  say-hello-workflow:
    jobs:
      - say-hello
      - say-bye:
          requires:
            - say-hello
